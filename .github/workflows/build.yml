name: Build and Package

on:
  push:
    branches: [ "main", "master", "CICD" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master", "CICD" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package (Windows x64)
    runs-on: windows-latest

    env:
      QT_VERSION: '6.11.2'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: 'win64_msvc2022_64'
          dir: 'C:/Qt'
          cache: true
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@master'

      - name: Download and Setup QtMsBuild
        shell: pwsh
        run: |
          $url = "https://download.qt.io/official_releases/vsaddin/3.5.0/qt-vsaddin-msbuild-3.5.0.zip"
          $zipPath = "$env:RUNNER_TEMP\qt-msbuild.zip"
          $destDir = "$env:GITHUB_WORKSPACE\ExplorerSelector\QtMsBuild"

          Write-Host "Downloading QtMsBuild from $url..." -ForegroundColor Cyan
          curl.exe -fL "$url" -o "$zipPath"

          Write-Host "Extracting to $destDir..." -ForegroundColor Cyan
          Expand-Archive -Path $zipPath -DestinationPath $destDir -Force

      - name: Build Solution
        shell: pwsh
        run: |
          $qtDir = "$env:QT_ROOT_DIR"
          $qtMsBuild = "$env:GITHUB_WORKSPACE\ExplorerSelector\QtMsBuild"

          if (-not (Test-Path $qtDir)) {
              throw "Qt directory not found: $qtDir"
          }

          if (-not (Test-Path (Join-Path $qtMsBuild "qt.targets"))) {
              throw "QtMsBuild files not found: $qtMsBuild"
          }
          
          Write-Host "Building ExplorerSelector.slnx with Qt at $qtDir..." -ForegroundColor Cyan
          msbuild ExplorerSelector.slnx /m /p:Configuration=Release /p:Platform=x64 /p:QtInstallDir="$qtDir" /p:QtMsBuild="$qtMsBuild"

      - name: Package Application
        shell: pwsh
        run: |
          Write-Host "Executing package.ps1..." -ForegroundColor Cyan
          .\package.ps1

      - name: Archive Package (Zip)
        shell: pwsh
        run: |
          Compress-Archive -Path .\App\* -DestinationPath ExplorerSelector-Release.zip -Force
          Write-Host "Created ExplorerSelector-Release.zip" -ForegroundColor Green

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ExplorerSelector-Windows-x64
          path: ExplorerSelector-Release.zip
          if-no-files-found: error
